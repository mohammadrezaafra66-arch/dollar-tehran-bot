version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: g3-postgres
    environment:
      POSTGRES_DB: g3_bot_panel
      POSTGRES_USER: g3_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-g3_secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - g3_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U g3_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: g3-redis
    ports:
      - "6379:6379"
    networks:
      - g3_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  panel-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: g3-panel-backend
    environment:
      DATABASE_URL: postgresql://g3_user:${DB_PASSWORD:-g3_secure_password}@postgres:5432/g3_bot_panel
      REDIS_URL: redis://redis:6379/0
      PANEL_API_PORT: 8100
      AFRAKALA_API_URL: ${AFRAKALA_API_URL:-http://localhost:8000}
      CHROME_USER_DATA_DIR: /app/chrome-profile
    ports:
      - "8100:8100"
    volumes:
      - ./logs:/app/logs
      - ./chrome-profile:/app/chrome-profile
      - ./divar-bot:/app/divar-bot
      - ./torob-bot:/app/torob-bot
      - ./google-maps-bot:/app/google-maps-bot
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - g3_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8100 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: g3-frontend
    environment:
      NEXT_PUBLIC_PANEL_API_URL: http://localhost:8100
    ports:
      - "3010:3010"
    depends_on:
      - panel-backend
    networks:
      - g3_network

networks:
  g3_network:
    driver: bridge

volumes:
  postgres_data:

