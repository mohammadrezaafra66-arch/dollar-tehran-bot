<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Afra Local Panel</title>
</head>
<body>
  <h1>Afra Local Panel</h1>

  <section>
    <h2>Admin</h2>
    <input id="admin-password" type="password" placeholder="Admin password">
  </section>

  <section>
    <h2>Auth Mode</h2>
    <button onclick="loadAuthMode()">Load Auth Mode</button>
    <pre id="auth-box">---</pre>
  </section>

  <section>
    <h2>Health</h2>
    <button onclick="loadHealth()">Load Health</button>
    <pre id="health-box">---</pre>
  </section>

  <section>
    <h2>Worker State</h2>
    <button onclick="loadWorkerState()">Load Worker State</button>
    <pre id="worker-box">---</pre>
  </section>

  <section>
    <h2>Queue</h2>
    <button onclick="loadQueue()">Load Queue</button>
    <button onclick="requestRun()">Request Run</button>
    <pre id="queue-box">---</pre>
  </section>

  <section>
    <h2>Inputs</h2>
    <button onclick="loadInputs()">Load Inputs</button>
    <button onclick="sampleInputs()">Create Sample Input</button>
    <pre id="inputs-box">---</pre>
  </section>

  <section>
    <h2>Manage</h2>
    <button onclick="loadManage()">Load Manage</button>
    <button onclick="sampleManage()">Create Sample Manage</button>
    <pre id="manage-box">---</pre>
  </section>

  <section>
    <h2>Outputs</h2>
    <button onclick="loadOutputs()">Load Outputs</button>
    <button onclick="sampleOutputs()">Create Sample Output</button>
    <div id="downloads-box"></div>
    <pre id="outputs-box">---</pre>
  </section>

  <section>
    <h2>Logs</h2>
    <button onclick="loadLogs()">Load Logs</button>
    <button onclick="sampleLogs()">Create Sample Log</button>
    <pre id="logs-box">---</pre>
  </section>

<script>
function adminHeaders() {
  const value = document.getElementById('admin-password').value;
  return value ? {'x-panel-password': value} : {};
}

async function api(url, options={}) {
  const response = await fetch(url, options);
  return await response.json();
}

async function apiPost(url) {
  return await api(url, {method:'POST', headers: adminHeaders()});
}

function show(id, data) {
  document.getElementById(id).textContent = JSON.stringify(data, null, 2);
}

function renderDownloads(data) {
  const files = data.files || data.items || [];
  const box = document.getElementById('downloads-box');
  box.innerHTML = files.map(file => `<p><a href="/api/google-maps/download/${encodeURIComponent(file.name)}" target="_blank">Download ${file.name}</a></p>`).join('');
}

async function loadAuthMode() { show('auth-box', await api('/api/auth-mode')); }
async function loadHealth() { show('health-box', await api('/api/health')); }
async function loadWorkerState() { show('worker-box', await api('/api/google-maps/worker-state')); }
async function loadQueue() { show('queue-box', await api('/api/google-maps/queue')); }
async function requestRun() { if (!confirm('ثبت درخواست اجرای ربات انجام شود؟')) return; show('queue-box', await apiPost('/api/google-maps/request-run')); await loadWorkerState(); }
async function loadInputs() { show('inputs-box', await api('/api/google-maps/inputs')); }
async function sampleInputs() { show('inputs-box', await apiPost('/api/google-maps/inputs/sample')); }
async function loadManage() { show('manage-box', await api('/api/google-maps/manage')); }
async function sampleManage() { show('manage-box', await apiPost('/api/google-maps/manage/sample')); }
async function loadOutputs() { const data = await api('/api/google-maps/outputs'); show('outputs-box', data); renderDownloads(data); }
async function sampleOutputs() { show('outputs-box', await apiPost('/api/google-maps/outputs/sample')); await loadOutputs(); }
async function loadLogs() { show('logs-box', await api('/api/google-maps/logs')); }
async function sampleLogs() { show('logs-box', await apiPost('/api/google-maps/logs/sample')); }
async function refreshAll() { await loadAuthMode(); await loadHealth(); await loadWorkerState(); await loadQueue(); await loadInputs(); await loadManage(); await loadOutputs(); await loadLogs(); }
refreshAll();
</script>
</body>
</html>
