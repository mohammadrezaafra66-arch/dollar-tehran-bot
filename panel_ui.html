<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Afra Google Maps Panel</title>
  <style>
    body{margin:0;background:#eef2f7;color:#111827;font-family:Tahoma,Arial,sans-serif}
    .wrap{max-width:1320px;margin:auto;padding:24px}.hero{background:linear-gradient(135deg,#111827,#1d4ed8);color:white;border-radius:22px;padding:26px;margin-bottom:18px}.hero h1{margin:0 0 8px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}.card{background:white;border:1px solid #e5e7eb;border-radius:18px;padding:18px;box-shadow:0 10px 28px rgba(15,23,42,.07)}.card h2{margin-top:0}input,select{width:100%;box-sizing:border-box;padding:11px;margin:6px 0 10px;border:1px solid #d1d5db;border-radius:12px;background:#fff}button{border:0;background:#2563eb;color:white;border-radius:12px;padding:10px 14px;margin:4px;cursor:pointer}button.secondary{background:#374151}button.danger{background:#b91c1c}pre{background:#0f172a;color:#e5e7eb;padding:12px;border-radius:14px;overflow:auto;max-height:240px;font-size:12px}label{font-size:13px;color:#374151}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hint{font-size:13px;color:#6b7280}.pill{display:inline-block;background:#e0f2fe;color:#075985;padding:6px 10px;border-radius:999px;margin:4px 0}
  </style>
</head>
<body>
<div class="wrap">
  <header class="hero"><span class="pill">Local Control Center</span><h1>پنل لوکال Google Maps Bot</h1><p>ورودی، تنظیمات، اجرا، وضعیت، لاگ و خروجی در یک صفحه قابل تست</p></header>
  <main class="grid">
    <section class="card"><h2>۱) ورودی جستجو</h2><p class="hint">مطابق فایل Input</p><div class="row"><div><label>استان</label><input id="province" value="تهران"></div><div><label>شهر</label><input id="city" value="شهریار"></div></div><label>کلمه اصلی</label><input id="keyword" value="فروشگاه لوازم خانگی"><div class="row"><div><label>برند</label><input id="brand" value="ال جی"></div><div><label>دسته بندی</label><input id="category" value="لوازم خانگی"></div></div><label>کلمات مرتبط</label><input id="related" value="یخچال, لباسشویی, ماشین ظرفشویی"><label>فعال؟</label><select id="active"><option value="true" selected>بله</option><option value="false">خیر</option></select><button onclick="saveInputForm()">ذخیره ورودی</button><button class="secondary" onclick="loadInputs()">نمایش</button><pre id="inputs-box">---</pre></section>
    <section class="card"><h2>۲) مدیریت اجرا</h2><p class="hint">تنظیمات اصلی اجرای ربات</p><div class="row"><div><label>Max Scrolls</label><input id="max_scrolls" type="number" value="5"></div><div><label>Businesses / Query</label><input id="max_businesses_per_query" type="number" value="5"></div></div><div class="row"><div><label>Extract Limit</label><input id="max_businesses_to_extract" type="number" value="5"></div><div><label>Website Crawl</label><select id="website_crawl_enabled"><option value="true" selected>فعال</option><option value="false">غیرفعال</option></select></div></div><button onclick="sampleManage()">ذخیره نمونه</button><button class="secondary" onclick="loadManage()">نمایش</button><pre id="manage-box">---</pre></section>
    <section class="card"><h2>۳) اجرا و وضعیت</h2><input id="admin-password" type="password" placeholder="Admin password اختیاری"><button class="danger" onclick="requestRun()">ثبت درخواست اجرا</button><button class="secondary" onclick="loadQueue()">صف اجرا</button><button class="secondary" onclick="loadWorkerState()">وضعیت Worker</button><pre id="queue-box">---</pre><pre id="worker-box">---</pre></section>
    <section class="card"><h2>۴) سلامت سیستم</h2><button onclick="refreshAll()">Refresh All</button><button class="secondary" onclick="loadAuthMode()">Auth Mode</button><pre id="health-box">---</pre><pre id="auth-box">---</pre></section>
    <section class="card"><h2>۵) خروجی‌ها</h2><button onclick="loadOutputs()">نمایش خروجی‌ها</button><div id="downloads-box"></div><pre id="outputs-box">---</pre></section>
    <section class="card"><h2>۶) لاگ‌ها</h2><button onclick="loadLogs()">نمایش لاگ‌ها</button><pre id="logs-box">---</pre></section>
  </main>
</div>
<script>
function adminHeaders(){const v=document.getElementById('admin-password').value;return v?{'x-panel-password':v}:{};}async function api(url,options={}){const r=await fetch(url,options);const d=await r.json();if(!r.ok)return{error:true,status:r.status,detail:d.detail||d};return d;}async function apiPost(url,body=null){const options={method:'POST',headers:{...adminHeaders()}};if(body){options.headers['Content-Type']='application/json';options.body=JSON.stringify(body);}return await api(url,options);}function show(id,data){document.getElementById(id).textContent=JSON.stringify(data,null,2);}function inputPayload(){return{items:[{province:province.value,city:city.value,keyword:keyword.value,brand:brand.value,related_keywords:related.value,category:category.value,active:active.value==='true'}]};}function renderDownloads(data){const files=data.files||data.items||[];downloadsBox.innerHTML=files.map(f=>`<p><a href="/api/google-maps/download/${encodeURIComponent(f.name)}" target="_blank">دانلود ${f.name}</a></p>`).join('')||'<p class="hint">هنوز خروجی‌ای پیدا نشد.</p>';}async function saveInputForm(){show('inputs-box',await apiPost('/api/google-maps/inputs/save',inputPayload()));}async function loadInputs(){show('inputs-box',await api('/api/google-maps/inputs'));}async function loadManage(){show('manage-box',await api('/api/google-maps/manage'));}async function sampleManage(){show('manage-box',await apiPost('/api/google-maps/manage/sample'));}async function requestRun(){if(!confirm('درخواست اجرای ربات ثبت شود؟'))return;show('queue-box',await apiPost('/api/google-maps/request-run'));await loadWorkerState();}async function loadQueue(){show('queue-box',await api('/api/google-maps/queue'));}async function loadWorkerState(){show('worker-box',await api('/api/google-maps/worker-state'));}async function loadHealth(){show('health-box',await api('/api/health'));}async function loadAuthMode(){show('auth-box',await api('/api/auth-mode'));}async function loadOutputs(){const d=await api('/api/google-maps/outputs');show('outputs-box',d);renderDownloads(d);}async function loadLogs(){show('logs-box',await api('/api/google-maps/logs'));}async function refreshAll(){await loadHealth();await loadAuthMode();await loadInputs();await loadManage();await loadQueue();await loadWorkerState();await loadOutputs();await loadLogs();}refreshAll();
</script>
</body>
</html>
