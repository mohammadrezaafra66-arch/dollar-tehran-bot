<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Afra Local Panel</title>
</head>
<body>
  <h1>Afra Local Panel</h1>

  <section>
    <h2>Health</h2>
    <button onclick="loadHealth()">Load Health</button>
    <pre id="health-box">---</pre>
  </section>

  <section>
    <h2>Queue</h2>
    <button onclick="loadQueue()">Load Queue</button>
    <button onclick="requestRun()">Request Run</button>
    <pre id="queue-box">---</pre>
  </section>

<script>
async function api(url, options={}) {
  const response = await fetch(url, options);
  return await response.json();
}

function show(id, data) {
  document.getElementById(id).textContent = JSON.stringify(data, null, 2);
}

async function loadHealth() {
  show('health-box', await api('/api/health'));
}

async function loadQueue() {
  show('queue-box', await api('/api/google-maps/queue'));
}

async function requestRun() {
  show('queue-box', await api('/api/google-maps/request-run', {method:'POST'}));
}
</script>
</body>
</html>
