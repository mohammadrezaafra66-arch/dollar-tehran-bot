app:
  timezone: "Asia/Tehran"
  request_timeout_seconds: 20
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
  sleep_between_sources_seconds: 4
  sqlite_path: "data/dollar_prices.db"
  export_dir: "output"

schedule:
  enabled: false
  interval_minutes: 15

sync:
  enabled: false
  afrakala_api_base_url: "${AFRAKALA_API_BASE_URL}"
  afrakala_bot_api_key: "${AFRAKALA_BOT_API_KEY}"
  dynamic_table_slug: "${AFRAKALA_TABLE_SLUG}"
  # اگر table_id را داری، اینجا بگذار تا دیگر با slug نگردد.
  dynamic_table_id: ""

sources:
  # فاز اول: ۵ منبع قابل ویرایش. selector/regex هر سایت باید بعد از تست صفحه واقعی تنظیم شود.
  # تا وقتی selector قطعی نشده، enabled را false نگه دار تا عدد اشتباه ثبت نشود.

  - source_code: "tgju"
    source_name: "TGJU - دلار آزاد"
    source_url: "https://www.tgju.org/"
    enabled: false
    method: "html_regex"
    price_kind: "average"
    regex: "دلار[^0-9۰-۹]*([0-9۰-۹]{2,3}(?:[,\\s][0-9۰-۹]{3})+)"

  - source_code: "eghtesadonline"
    source_name: "اقتصاد آنلاین - قیمت ارز"
    source_url: "https://www.eghtesadonline.com/"
    enabled: false
    method: "html_regex"
    price_kind: "average"
    regex: "دلار[^0-9۰-۹]*([0-9۰-۹]{2,3}(?:[,\\s][0-9۰-۹]{3})+)"

  - source_code: "tejaratnews"
    source_name: "تجارت نیوز - قیمت دلار"
    source_url: "https://tejaratnews.com/"
    enabled: false
    method: "html_regex"
    price_kind: "average"
    regex: "دلار[^0-9۰-۹]*([0-9۰-۹]{2,3}(?:[,\\s][0-9۰-۹]{3})+)"

  - source_code: "donya_e_eqtesad"
    source_name: "دنیای اقتصاد - قیمت دلار"
    source_url: "https://donya-e-eqtesad.com/"
    enabled: false
    method: "html_regex"
    price_kind: "average"
    regex: "دلار[^0-9۰-۹]*([0-9۰-۹]{2,3}(?:[,\\s][0-9۰-۹]{3})+)"

  - source_code: "bonbast"
    source_name: "Bonbast - USD"
    source_url: "https://bonbast.com/"
    enabled: false
    method: "html_regex"
    price_kind: "average"
    regex: "USD[^0-9]*([0-9]{2,3}(?:[,\\s][0-9]{3})+)"

  # منبع تستی برای اینکه مطمئن شویم برنامه بدون وابستگی به سایت‌ها درست اجرا می‌شود.
  - source_code: "manual_test"
    source_name: "تست دستی"
    source_url: "manual://test"
    enabled: true
    method: "manual"
    price_kind: "average"
    manual_price_toman: 68500
