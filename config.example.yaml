app:
  timezone: "Asia/Tehran"
  request_timeout_seconds: 20
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
  sleep_between_sources_seconds: 4
  sqlite_path: "data/dollar_prices.db"
  export_dir: "output"

schedule:
  enabled: false
  interval_minutes: 15

sync:
  enabled: false
  afrakala_api_base_url: "${AFRAKALA_API_BASE_URL}"
  afrakala_bot_api_key: "${AFRAKALA_BOT_API_KEY}"
  dynamic_table_slug: "${AFRAKALA_TABLE_SLUG}"
  dynamic_table_id: ""

sources:
  # فقط TGJU فعال است.
  # این صفحه قیمت دلار را به ریال نمایش می‌دهد؛ ربات با unit: rial آن را به تومان تبدیل می‌کند.
  - source_code: "tgju"
    source_name: "TGJU - دلار تهران"
    source_url: "https://www.tgju.org/profile/price_dollar_rl"
    enabled: true
    method: "html_selector"
    price_kind: "average"
    unit: "rial"
    selector: "#main > div.stocks-profile > div.fs-row.bootstrap-fix.widgets.full-w-set.profile-social-share-box > div.row.tgju-widgets-row > div.tgju-widgets-block.col-md-12.col-lg-4.tgju-widgets-block-bottom-unset.overview-first-block > div > div:nth-child(2) > div > div.tables-default.normal > table > tbody > tr:nth-child(1) > td.text-left"
