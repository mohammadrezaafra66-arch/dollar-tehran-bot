app:
  timezone: "Asia/Tehran"
  request_timeout_seconds: 20
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
  sleep_between_sources_seconds: 5
  min_cache_seconds: 60
  max_consecutive_failures: 3
  cooldown_seconds: 300
  sqlite_path: "data/dollar_prices.db"
  export_dir: "output"

schedule:
  enabled: false
  interval_minutes: 3

sync:
  enabled: false
  afrakala_api_base_url: "${AFRAKALA_API_BASE_URL}"
  afrakala_bot_api_key: "${AFRAKALA_BOT_API_KEY}"
  dynamic_table_slug: "${AFRAKALA_TABLE_SLUG}"
  dynamic_table_id: ""

sources:
  - source_code: "tgju_dollar"
    source_name: "TGJU - دلار تهران"
    source_url: "https://www.tgju.org/profile/price_dollar_rl"
    enabled: true
    method: "html_regex"
    price_kind: "average"
    unit: "rial"
    regex: "نرخ فعلی[:：\\s]*([0-9۰-۹]{1,3}(?:[,،][0-9۰-۹]{3})+)"

  - source_code: "tgju_aed"
    source_name: "TGJU - درهم امارات"
    source_url: "https://www.tgju.org/profile/price_aed"
    enabled: true
    method: "html_regex"
    price_kind: "average"
    unit: "rial"
    regex: "نرخ فعلی[:：\\s]*([0-9۰-۹]{1,3}(?:[,،][0-9۰-۹]{3})+)"

  - source_code: "tgju_eur"
    source_name: "TGJU - یورو"
    source_url: "https://www.tgju.org/profile/price_eur"
    enabled: true
    method: "html_regex"
    price_kind: "average"
    unit: "rial"
    regex: "نرخ فعلی[:：\\s]*([0-9۰-۹]{1,3}(?:[,،][0-9۰-۹]{3})+)"

  - source_code: "alanchand_usd"
    source_name: "الان چند - دلار تهران"
    source_url: "https://alanchand.com/currencies-price/usd"
    enabled: true
    method: "html_selector"
    price_kind: "average"
    unit: "toman"
    selector: "section.container.mostPopularRate div.singleTop div.row > div.col-md-6.text-center.mt-3.mt-md-0:nth-of-type(1) div.d-flex.justify-content-between.align-items-center div.d-flex.flex-column.justify-content-between.align-items-center.mt-2 > span.fw-bold.text-success.fs-5:nth-of-type(1)"
