app:
  timezone: "Asia/Tehran"
  request_timeout_seconds: 20
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
  sleep_between_sources_seconds: 4
  sqlite_path: "data/dollar_prices.db"
  export_dir: "output"

schedule:
  enabled: false
  interval_minutes: 15

sync:
  enabled: false
  afrakala_api_base_url: "${AFRAKALA_API_BASE_URL}"
  afrakala_bot_api_key: "${AFRAKALA_BOT_API_KEY}"
  dynamic_table_slug: "${AFRAKALA_TABLE_SLUG}"
  dynamic_table_id: ""

sources:
  # فقط TGJU فعال است. منابع دیگر عمداً حذف شدند تا خروجی ربات تمیز و قابل‌ردیابی بماند.
  - source_code: "tgju"
    source_name: "TGJU - دلار آزاد"
    source_url: "https://www.tgju.org/"
    enabled: true
    method: "html_regex"
    price_kind: "average"
    regex: "دلار[^0-9۰-۹]{0,120}([0-9۰-۹]{2,4}\\s*هزار(?:\\s*و\\s*[0-9۰-۹]{1,3})?|[0-9۰-۹]{2,3}(?:[,،\\s][0-9۰-۹]{3})+)"
